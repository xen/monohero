[package]
name = "monohero"
version = "0.1.0"
edition = "2021"
rust-version = "1.81"
description = "Local durable FIFO queues for quiet, exclusive agent workflows"
license = "MIT"
repository = "https://github.com/xen/monohero"

[dependencies]
anyhow = "1"
clap = { version = "=4.5.23", features = ["derive", "env"] }
fs2 = "0.4"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "=3.14.0"
