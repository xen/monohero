[package]
name = "monohero-ui"
version = "0.5.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/xen/monohero"

[dependencies]
gpui-kit = "=0.9.0"
futures = "0.3"
serde_json = "1"
fs2 = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = { version = "=0.26.1", default-features = false }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication"] }
